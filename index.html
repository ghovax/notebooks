<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research findings</title>
<script>
const codes = ["en", "ja"];
const asked = (navigator.languages || [navigator.language || ""]).map(tag => tag.slice(0, 2).toLowerCase());
location.replace((asked.find(code => codes.includes(code)) || codes[0]) + "/" + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
</head>
<body><p><a href="en/" hreflang="en" lang="en">English</a> · <a href="ja/" hreflang="ja" lang="ja">日本語</a></p></body>
</html>
